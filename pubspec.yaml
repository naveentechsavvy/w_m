name: w_m
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '^3.12.2'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Image Picker
  image_picker: ^1.1.2

  # State Management
  get: ^4.7.2

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0

  # Local Storage
  shared_preferences: ^2.5.3

  # UI
  google_fonts: ^6.3.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.0

  # Maps
  google_maps_flutter: ^2.12.3
  geolocator: ^14.0.2
  geocoding: ^5.0.0

  # Utilities
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
      - assets/images/
      - assets/banners/
      - assets/experiences/
      - assets/logos/
      - assets/logo/