<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- sun glow -->
  <circle cx="260" cy="140" r="110" fill="#F6C89A" opacity="0.35"/>
  <circle cx="260" cy="140" r="80" fill="#F6C89A" opacity="0.45"/>

  <!-- clouds -->
  <g fill="#F3D9C4" opacity="0.9">
    <ellipse cx="120" cy="60" rx="26" ry="14"/>
    <ellipse cx="145" cy="55" rx="20" ry="12"/>
    <ellipse cx="335" cy="70" rx="22" ry="12"/>
    <ellipse cx="355" cy="65" rx="16" ry="10"/>
  </g>

  <!-- city skyline -->
  <g fill="#EFD3BC">
    <rect x="230" y="120" width="34" height="120" rx="4"/>
    <rect x="268" y="90" width="40" height="150" rx="4"/>
    <rect x="312" y="130" width="30" height="110" rx="4"/>
    <rect x="346" y="105" width="36" height="135" rx="4"/>
  </g>
  <g fill="#F6E3D1">
    <rect x="238" y="135" width="8" height="10"/>
    <rect x="252" y="135" width="8" height="10"/>
    <rect x="238" y="160" width="8" height="10"/>
    <rect x="252" y="160" width="8" height="10"/>
    <rect x="278" y="110" width="8" height="10"/>
    <rect x="292" y="110" width="8" height="10"/>
    <rect x="278" y="135" width="8" height="10"/>
    <rect x="292" y="135" width="8" height="10"/>
    <rect x="278" y="160" width="8" height="10"/>
    <rect x="292" y="160" width="8" height="10"/>
    <rect x="320" y="150" width="7" height="9"/>
    <rect x="333" y="150" width="7" height="9"/>
    <rect x="356" y="125" width="7" height="9"/>
    <rect x="369" y="125" width="7" height="9"/>
    <rect x="356" y="150" width="7" height="9"/>
    <rect x="369" y="150" width="7" height="9"/>
  </g>

  <!-- map base -->
  <path d="M40 210 L120 195 L200 215 L280 198 L370 218 L360 260 L280 245 L200 262 L120 242 L40 258 Z"
        fill="#FBF3E7" stroke="#E9DAC6" stroke-width="2"/>
  <!-- map fold lines -->
  <line x1="120" y1="195" x2="120" y2="242" stroke="#E9DAC6" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="200" y1="215" x2="200" y2="262" stroke="#E9DAC6" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="280" y1="198" x2="280" y2="245" stroke="#E9DAC6" stroke-width="1.5" stroke-dasharray="4 4"/>
  <!-- dotted route -->
  <path d="M70 230 Q150 210 230 232 T330 225" fill="none" stroke="#D98E63" stroke-width="2.5" stroke-dasharray="1 7" stroke-linecap="round"/>

  <!-- leaves -->
  <g>
    <path d="M330 250 C300 240 285 260 300 285 C330 285 345 265 330 250 Z" fill="#8CBF8A"/>
    <path d="M355 245 C330 240 320 265 340 288 C365 285 375 260 355 245 Z" fill="#A6D2A0"/>
    <path d="M300 285 C330 285 300 285 300 285 Z" fill="#8CBF8A"/>
  </g>

  <!-- pin shadow -->
  <ellipse cx="185" cy="222" rx="16" ry="5" fill="#000000" opacity="0.08"/>

  <!-- location pin -->
  <path d="M185 130 C160 130 145 150 145 172 C145 202 185 222 185 222 C185 222 225 202 225 172 C225 150 210 130 185 130 Z"
        fill="#E8703A"/>
  <circle cx="185" cy="172" r="16" fill="#FBF3E7"/>
</svg>
